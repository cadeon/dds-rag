ddc:
  min_confidence: 0.7
  fallback_parent: true
  expand_siblings: true
  min_results_threshold: 10

card_writer:
  model: "qwen3.6-hermes-27b"
  endpoint: "http://172.30.250.101:8000/v1"
  max_abstract_length: 100
  temperature: 0.1

embedding:
  model: "text-embedding-3-small"
  endpoint: "http://172.30.250.101:8000/v1"
  dimensions: 1536

reranker:
  model: "BAAI/bge-reranker-base"

retrieval:
  top_k: 10
  fused_top_k: 20
  chunk_size: 500
  chunk_overlap: 50

storage:
  type: "sqlite"
  path: "dds_rag.db"
