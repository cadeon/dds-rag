<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Card - CARD CATALOG</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="catalog-header">
        <h1 class="catalog-title">CARD CATALOG</h1>
        <p class="catalog-subtitle">UniversalDecimalInator</p>
        <a href="https://github.com/cadeon/dds-rag" class="catalog-github" target="_blank" rel="noopener">GitHub</a>
    </header>

    <nav class="nav-bar">
        <a href="{{ url_for('index') }}" class="nav-link">Catalog</a>
        <a href="{{ url_for('ingest_page') }}" class="nav-link">Ingest</a>
        <a href="{{ url_for('search') }}" class="nav-link">Search</a>
        <form action="{{ url_for('search') }}" method="GET" class="search-bar">
            <input type="text" name="q" class="search-input" placeholder="Search the catalog...">
            <button type="submit" class="search-btn">Search</button>
        </form>
    </nav>

    <main class="catalog-body">
        <div class="breadcrumb">
            <a href="{{ url_for('index') }}">Catalog</a>
            <span class="breadcrumb-sep">&rsaquo;</span>
            <a href="{{ url_for('card_detail', card_id=card.id) }}">Card {{ card.id[:8] }}</a>
            <span class="breadcrumb-sep">&rsaquo;</span>
            <span>Edit</span>
        </div>

        <div class="card-detail">
            <form method="POST" action="{{ url_for('card_edit', card_id=card.id) }}">
                <div class="form-group">
                    <label class="form-label">Title</label>
                    <input type="text" name="title" class="form-input" value="{{ card.title }}">
                </div>

                <div class="form-group">
                    <label class="form-label">UDC Classification</label>
                    <input type="text" name="udc_number" class="form-input" value="{{ card.classification.primary }}" placeholder="e.g. 516.37">
                </div>

                <div class="form-group">
                    <label class="form-label">Abstract</label>
                    <textarea name="abstract" class="form-textarea" rows="6">{{ card.abstract }}</textarea>
                </div>

                <div class="form-group">
                    <label class="form-label">Content</label>
                    <textarea name="content" class="form-textarea" rows="12">{{ card.content }}</textarea>
                </div>

                <div class="form-group">
                    <label class="form-label">Author</label>
                    <input type="text" name="author" class="form-input" value="{{ card.author or '' }}">
                </div>

                <div class="form-group">
                    <label class="form-label">Source URL</label>
                    <input type="text" name="source_url" class="form-input" value="{{ card.source_url or '' }}">
                </div>

                <div class="form-group">
                    <label class="form-label">Sources (JSON, one per line)</label>
                    <textarea name="sources_json" class="form-textarea" rows="4" placeholder='{"type": "url", "uri": "https://example.com", "content_type": "text/html"}'>{% for src in card.sources %}
{{ src.to_dict() | tojson }}{% endfor %}</textarea>
                </div>

                <div class="form-group">
                    <label class="form-label">Format</label>
                    <select name="format" class="form-input">
                        <option value="url_fetch"{% if card.format == 'url_fetch' %} selected{% endif %}>URL Fetch</option>
                        <option value="text_paste"{% if card.format == 'text_paste' %} selected{% endif %}>Text Paste</option>
                        <option value="artifact_drop"{% if card.format == 'artifact_drop' %} selected{% endif %}>Artifact Drop</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">UDC Label</label>
                    <input type="text" name="udc_label" class="form-input" value="{{ card.udc_label or '' }}">
                </div>

                <div class="form-group">
                    <label class="form-label">Tags (comma-separated)</label>
                    <input type="text" name="tags" class="form-input" value="{{ card.tags|join(', ') }}">
                </div>

                <div class="form-group">
                    <label class="form-label">Topics (comma-separated)</label>
                    <input type="text" name="topics" class="form-input" value="{{ card.topics|join(', ') }}">
                </div>

                <div style="display: flex; gap: 0.5rem; justify-content: flex-end;">
                    <a href="{{ url_for('card_detail', card_id=card.id) }}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </main>

    <footer class="catalog-footer">
        CARD CATALOG &mdash; <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC-BY-SA 4.0</a>
    </footer>
</body>
</html>
