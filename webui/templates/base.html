<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}UniversalDecimalInator Card Catalog{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header class="catalog-header">
        <a href="{{ url_for('index') }}" class="catalog-home"><span class="catalog-title">universalDecimalInator</span></a>
        <a href="https://github.com/cadeon/dds-rag" class="catalog-github" target="_blank" rel="noopener" title="GitHub">
            <svg height="24" viewBox="0 0 16 16" width="24" fill="var(--card-cream)">
                <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
            </svg>
        </a>
    </header>

    <nav class="nav-bar">
        <a href="{{ url_for('index') }}" class="nav-link{% if active_nav == 'catalog' %} active{% endif %}">Card Catalog</a>
        <a href="{{ url_for('ingest_page') }}" class="nav-link{% if active_nav == 'ingest' %} active{% endif %}">Ingest</a>
        <a href="{{ url_for('search') }}" class="nav-link{% if active_nav == 'search' %} active{% endif %}">Search</a>
        <form action="{{ url_for('search') }}" method="GET" class="search-bar">
            <input type="text" name="q" class="search-input" placeholder="Search the catalog..." {% if search_query %}value="{{ search_query }}"{% endif %}>
            <button type="submit" class="search-btn">Search</button>
        </form>
    </nav>

    <main class="catalog-body">
        {% block content %}{% endblock %}
    </main>

    <footer class="catalog-footer">
        <a href="https://github.com/cadeon/dds-rag" target="_blank" rel="noopener">GitHub</a> &mdash; <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC-BY-SA 4.0</a> &mdash; UniversalDecimalInator
    </footer>
</body>
</html>
